<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090609">
    <title>HAYTAM + IMAN ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div id="heartsContainer"></div>

    <!-- YouTube Music -->
    <div id="youtubePlayer"></div>

    <!-- =========================
         WELCOME PAGE
    ========================== -->
    <main id="welcomePage" class="page active">

        <section class="welcome-content">

            <div class="heart-area">

                <svg class="heart-svg"
                     viewBox="0 0 300 280"
                     xmlns="http://www.w3.org/2000/svg">

                    <path
                        class="heart-path"
                        d="M150 250
                           C130 230 35 175 35 95
                           C35 40 105 20 150 75
                           C195 20 265 40 265 95
                           C265 175 170 230 150 250Z">
                    </path>

                    <path
                        class="heart-fill"
                        d="M150 250
                           C130 230 35 175 35 95
                           C35 40 105 20 150 75
                           C195 20 265 40 265 95
                           C265 175 170 230 150 250Z">
                    </path>

                    <foreignObject
                        x="55"
                        y="105"
                        width="190"
                        height="80">

                        <div class="heart-content">
                            <div class="names">
                                HAYTAM + IMAN
                            </div>

                            <div class="heart-symbol">
                                ❤️
                            </div>
                        </div>

                    </foreignObject>

                </svg>

            </div>

            <p class="welcome-text">
                عندي ليك واحد المفاجأة ❤️
            </p>

            <button id="fingerprintButton" class="fingerprint-button">
                <span class="fingerprint-icon">☝️</span>
                <span>اضغط هنا</span>
            </button>

        </section>

    </main>


    <!-- =========================
         GIFT PAGE
    ========================== -->
    <main id="giftPage" class="page">

        <section class="gift-content">

            <div class="music-control">
                <button id="musicButton" aria-label="Music">
                    🔇
                </button>
            </div>

            <div class="gift-title">
                <span>🎁</span>
                <h1>هدية ليك</h1>
                <span>❤️</span>
            </div>

            <p class="gift-subtitle">
                افتحي الهدية باش تشوفي المفاجأة
            </p>


            <!-- Gift Box -->
            <div id="giftBox" class="gift-box-container">

                <div class="gift-box">

                    <div class="gift-lid">
                        <div class="ribbon-horizontal"></div>
                    </div>

                    <div class="gift-body">
                        <div class="ribbon-vertical"></div>
                    </div>

                    <div class="gift-bow">
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- Message -->
            <section id="messageSection" class="message-section">

                <div class="message-card">

                    <div class="message-heart">
                        ❤️
                    </div>

                    <h2>
                        إلى إيمان
                    </h2>

                    <p>
                        وجودك فحياتي حاجة مميزة بزاف،
                        وكل لحظة معاك عندها معنى خاص.
                        بغيت غير نقول ليك بأنك شخص غالي
                        وعزيز على قلبي. ❤️
                    </p>

                    <div class="message-signature">
                        HAYTAM ❤️
                    </div>

                </div>

            </section>


            <!-- =========================
                 GALLERY
            ========================== -->
            <section class="gallery-section">

                <div class="section-title">
                    <span>📸</span>
                    <h2>ذكرياتنا</h2>
                    <span>❤️</span>
                </div>

                <div class="gallery">

                    <button
                        id="prevButton"
                        class="gallery-arrow left"
                        aria-label="Previous">
                        ‹
                    </button>


                    <div class="main-photo-wrapper">

                        <img
                            id="mainPhoto"
                            src="https://i.postimg.cc/PLACEHOLDER/photo1.jpg"
                            alt="Memory">

                        <button
                            id="fullscreenButton"
                            class="fullscreen-button">
                            ⛶
                        </button>

                    </div>


                    <button
                        id="nextButton"
                        class="gallery-arrow right"
                        aria-label="Next">
                        ›
                    </button>

                </div>


                <div
                    id="photoCounter"
                    class="photo-counter">
                    1 / 4
                </div>


                <div class="thumbnails">

                    <button
                        class="thumbnail active"
                        data-index="0">

                        <img
                            src="https://i.postimg.cc/PLACEHOLDER/photo1.jpg"
                            alt="Photo 1">

                    </button>


                    <button
                        class="thumbnail"
                        data-index="1">

                        <img
                            src="https://i.postimg.cc/PLACEHOLDER/photo2.jpg"
                            alt="Photo 2">

                    </button>


                    <button
                        class="thumbnail"
                        data-index="2">

                        <img
                            src="https://i.postimg.cc/PLACEHOLDER/photo3.jpg"
                            alt="Photo 3">

                    </button>


                    <button
                        class="thumbnail"
                        data-index="3">

                        <img
                            src="https://i.postimg.cc/PLACEHOLDER/photo4.jpg"
                            alt="Photo 4">

                    </button>

                </div>

            </section>

        </section>

    </main>


    <!-- =========================
         LIGHTBOX
    ========================== -->
    <div id="lightbox" class="lightbox">

        <button
            id="closeLightbox"
            class="close-lightbox">
            ×
        </button>


        <button
            id="lightboxPrev"
            class="lightbox-arrow lightbox-left">
            ‹
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt="Fullscreen memory">

            <div
                id="lightboxCounter"
                class="lightbox-counter">
                1 / 4
            </div>

        </div>


        <button
            id="lightboxNext"
            class="lightbox-arrow lightbox-right">
            ›
        </button>

    </div>


    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Main JS -->
    <script src="script.js"></script>

</body>
</html>
